<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafaf8">
<title>Curl — Training Notebook</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f7f7f5; --paper:#ffffff; --ink:#171717; --muted:#85858a;
  --line:#e5e5e2; --soft:#f0f0ed; --accent:#6f63d9; --accent2:#8277e5;
  --shadow:0 10px 30px rgba(0,0,0,.07);
  --radius:22px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit}
button{border:0;color:inherit;cursor:pointer}
button:active{transform:scale(.985)}
.app{width:min(100%,560px);margin:auto;min-height:100vh;padding:0 22px calc(105px + env(safe-area-inset-bottom))}
.top{
  height:82px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:rgba(250,250,248,.92);backdrop-filter:blur(18px);z-index:10
}
.logo{font-size:28px;font-weight:800;letter-spacing:-1.5px}
.top-actions{display:flex;gap:9px}
.circle{
  width:43px;height:43px;border-radius:50%;background:var(--paper);
  border:1px solid var(--line);display:grid;place-items:center;font-size:19px;
}
.hero{padding:35px 0 27px}
.kicker{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:7px}
h1{font-size:54px;line-height:.92;letter-spacing:-4px;margin:0;font-weight:800}
.search{
  height:55px;border:1px solid var(--line);background:var(--paper);border-radius:28px;
  display:flex;align-items:center;padding:0 18px;gap:10px;margin-bottom:31px;
}
.search-icon{font-size:25px;color:#777;line-height:1}
.search input{border:0;outline:0;background:none;width:100%;font-size:17px;color:var(--ink)}
.search input::placeholder{color:#a0a0a0}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 2px 15px}
.section-title span{font-size:14px;color:#888;font-weight:650}
.link-btn{background:none;font-size:14px;font-weight:700;padding:5px 0}
.folder-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:25px 17px}
.folder-card{background:none;text-align:left;padding:0;position:relative;min-width:0}
.folder-art{
  height:118px;position:relative;overflow:hidden;border-radius:6px 14px 14px 14px;
  background:#ff9800;
  box-shadow:0 12px 25px rgba(76,68,160,.16);
}
.folder-art:before{
  content:"";position:absolute;left:0;top:0;width:49%;height:25px;
  background:#796ee2;border-radius:6px 11px 0 0;
}
.folder-art:after{
  content:"";position:absolute;left:0;right:0;top:24px;height:2px;background:rgba(255,255,255,.22);
}
.folder-inner{
  position:absolute;left:15px;right:15px;bottom:14px;color:#fff;
  display:flex;justify-content:space-between;align-items:flex-end;z-index:2;
}
.folder-count{font-size:12px;font-weight:650;opacity:.9}
.folder-dots{font-size:18px;letter-spacing:2px;line-height:1;opacity:.9}
.folder-name{font-size:17px;font-weight:750;letter-spacing:-.45px;margin:10px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder-meta{font-size:12px;color:#999;margin:4px 3px 0}
.folder-card:active .folder-art{transform:translateY(1px)}
.empty{
  border:1px dashed #ddd;background:var(--paper);border-radius:20px;padding:28px 18px;
  text-align:center;color:#999;font-size:14px
}
.recent{margin-top:38px}
.exercise-list{border-top:1px solid var(--line)}
.exercise-row{
  width:100%;display:flex;align-items:center;gap:13px;text-align:left;
  background:none;border-bottom:1px solid var(--line);padding:15px 3px;
}
.exercise-symbol{
  width:40px;height:40px;border-radius:13px;background:#eee;
  display:grid;place-items:center;font-size:15px;font-weight:800;flex:none
}
.exercise-main{min-width:0;flex:1}
.exercise-name{font-size:16px;font-weight:700;letter-spacing:-.25px}
.exercise-meta{font-size:12px;color:#999;margin-top:4px}
.arrow{font-size:24px;color:#aaa;font-weight:300}
.bottom{
  position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;
  width:min(100%,560px);padding:12px 22px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(250,250,248,.98) 28%);
}
.add{
  height:55px;width:100%;border-radius:28px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:750;box-shadow:0 9px 25px rgba(111,99,217,.22)
}
.view{display:none}.view.active{display:block}
.subtop{height:82px;display:flex;align-items:center;justify-content:space-between}
.back{background:none;font-size:15px;font-weight:650;padding:8px 0}
.page-heading{padding:30px 0 27px}
.page-heading h2{font-size:48px;line-height:.94;letter-spacing:-3.2px;margin:0;font-weight:800}
.page-heading p{font-size:14px;color:#999;margin:9px 0 0}
.rows{border-top:1px solid var(--line)}
.row{
  width:100%;background:none;border-bottom:1px solid var(--line);padding:17px 2px;
  display:flex;align-items:center;justify-content:space-between;text-align:left
}
.row-left{display:flex;align-items:center;gap:13px;min-width:0}
.row-symbol{width:39px;height:39px;border-radius:12px;background:#eee;display:grid;place-items:center;font-weight:800;flex:none}
.row-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-size:12px;color:#999;margin-top:3px}
.exercise-head{
  padding:27px 0 25px;border-bottom:1px solid var(--line)
}
.exercise-head .small{font-size:13px;color:#999;margin-bottom:8px}
.exercise-head h2{font-size:43px;line-height:.96;letter-spacing:-2.7px;margin:0;font-weight:800}
.people-strip{display:flex;gap:9px;overflow:auto;padding:19px 0 5px}
.person-pill{
  flex:none;background:var(--paper);border:1px solid var(--line);border-radius:18px;
  padding:9px 12px;min-width:86px;text-align:left
}
.person-pill.selected{border-color:#111;background:#111;color:#fff}
.avatar{width:28px;height:28px;border-radius:50%;background:#e9e9e7;display:grid;place-items:center;font-size:11px;font-weight:800;margin-bottom:6px}
.person-pill.selected .avatar{background:#333;color:#fff}
.person-pill span{font-size:12px;font-weight:700;white-space:nowrap}
.log{
  margin-top:21px;background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:16px
}
.log-top{display:flex;justify-content:space-between;gap:10px}
.log-date{font-size:14px;font-weight:750}.log-time{font-size:12px;color:#999;margin-top:3px}
.pr{font-size:12px;color:#888}
.table{margin-top:13px;display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:5px}
.table div{background:#f1f1ef;border-radius:8px;padding:8px 5px;text-align:center;font-size:12px}
.table .head{background:none;color:#999;font-weight:700}
.note{font-size:13px;color:#777;line-height:1.45;margin-top:12px}
.sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:50;
  display:none;align-items:flex-end
}
.sheet.show{display:flex}
.sheet-card{
  width:100%;background:#fafaf8;border-radius:27px 27px 0 0;
  padding:11px 22px calc(24px + env(safe-area-inset-bottom));max-height:84vh;overflow:auto
}
.handle{width:37px;height:4px;border-radius:4px;background:#d4d4d0;margin:0 auto 22px}
.sheet-title{font-size:29px;letter-spacing:-1.5px;font-weight:800;margin:0 0 18px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:#888;font-weight:700;margin:0 0 7px 3px}
.field input,.field select{
  width:100%;height:52px;border:1px solid #ddd;background:#fff;border-radius:17px;
  outline:none;padding:0 15px
}
.actions{display:flex;gap:9px;margin-top:17px}
.cancel,.save{
  height:52px;border-radius:26px;font-weight:750;padding:0 20px
}
.cancel{background:#ececea}.save{background:var(--accent);color:#fff;flex:1}

.set-editor{margin-top:4px}
.set-editor-head{display:grid;grid-template-columns:1fr 1fr 42px;gap:8px;padding:0 3px 6px;color:#888;font-size:12px;font-weight:700}
.set-editor-row{display:grid;grid-template-columns:1fr 1fr 42px;gap:8px;margin-bottom:8px}
.set-editor-row input{width:100%;height:50px;border:1px solid #ddd;background:#fff;border-radius:15px;outline:none;padding:0 14px;font-size:16px}
.remove-set{height:50px;border:0;background:#eee;color:#777;border-radius:15px;font-size:20px;cursor:pointer}
.add-set{height:44px;border:1px dashed #d5d5d1;background:transparent;border-radius:15px;width:100%;font-weight:700;color:#555;margin-top:2px}

.action-list{display:flex;flex-direction:column;gap:7px}
.action-item{
  width:100%;min-height:54px;border-radius:16px;background:#fff;
  border:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;text-align:left;font-weight:650;
}
.action-item .action-icon{color:#999;font-size:20px}
.action-item.danger{color:#c0392b}
.confirm-copy{font-size:14px;line-height:1.45;color:#777;margin:-4px 0 16px}
.inline-menu{
  width:34px;height:34px;border-radius:50%;background:#f0f0ed;color:#777;
  display:grid;place-items:center;font-size:17px;flex:none;
}
.log-top .log-actions{display:flex;align-items:center;gap:8px}
.log-set-row{display:grid;grid-template-columns:34px 1fr 1fr 38px;gap:5px;align-items:center}
.log-set-row>div{background:#f1f1ef;border-radius:8px;padding:8px 5px;text-align:center;font-size:12px}
.log-set-row .set-more{background:transparent;color:#888;padding:0}

.toast{
  position:fixed;z-index:90;left:50%;bottom:92px;transform:translate(-50%,12px);
  opacity:0;background:#111;color:#fff;padding:12px 16px;border-radius:15px;font-size:13px;
  pointer-events:none;transition:.2s;white-space:nowrap
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:430px){
  .folder-grid{grid-template-columns:repeat(3,1fr);gap:28px 16px}
  .folder-art{height:101px}
}

/* Final mobile polish */
.topbar{
  min-height:92px;
  height:auto;
  padding:18px 18px 14px;
  align-items:center;
}
.brand{
  font-size:34px !important;
  line-height:1 !important;
}
.pageTitle, .heroTitle, .foldersTitle{
  margin-top:22px !important;
  line-height:.95 !important;
}
.folderGrid{
  margin-top:18px !important;
}
.folderCard{
  border-radius:24px !important;
  box-shadow:0 10px 28px rgba(65,58,145,.10) !important;
}
.folderCard .folderTop{
  background:rgba(255,255,255,.20) !important;
}
.folderCard .folderBody{
  background:var(--folder) !important;
}

</style>

<style id="curl-wordmark-style">
  /* Approved Curl wordmark: bold sans-serif C + italic serif "url", with natural spacing. */
  .brand{
    display:inline-flex !important;
    align-items:baseline !important;
    white-space:nowrap !important;
    font-size:40px !important;
    line-height:1 !important;
    letter-spacing:-.025em !important;
    transform:none !important;
  }
  .brand .mark-c{
    font-family:Arial, Helvetica, sans-serif !important;
    font-weight:900 !important;
    font-style:normal !important;
    font-size:1.04em !important;
    letter-spacing:-.055em !important;
    line-height:1 !important;
    position:relative;
    z-index:2;
  }
  .brand .mark-url{
    font-family:Georgia, "Times New Roman", serif !important;
    font-weight:700 !important;
    font-style:italic !important;
    font-size:.90em !important;
    letter-spacing:-.055em !important;
    line-height:1 !important;
    margin-left:0 !important;
    position:relative;
    top:.02em;
  }
  .brand .mark-l{
    display:inline !important;
    font-size:1em !important;
    line-height:1 !important;
    margin-left:0 !important;
    transform:none !important;
  }
</style>

</head>
<body>
<div class="app">

<section id="home" class="view active">
  <header class="top">
    <div class="logo brand" aria-label="Curl"><span class="mark-c">C</span><span class="mark-url">ur<span class="mark-l">l</span></span></div>
    <div class="top-actions">
      <button class="circle" onclick="openPeople()">●</button>
      <button class="circle" onclick="openSettings()">•••</button>
    </div>
  </header>

  <div class="search">
    <span class="search-icon">⌕</span>
    <input id="search" placeholder="Search" oninput="renderHome()">
  </div>

  <div class="section-title">
    <span>Folders</span><button class="link-btn" onclick="openFolderSheet()">New folder</button>
  </div>
  <div id="folderGrid" class="folder-grid"></div>

  <div class="recent">
    <div class="section-title">
      <span>Recent exercises</span><button class="link-btn" onclick="showAllExercises()">See all</button>
    </div>
    <div id="recentList" class="exercise-list"></div>
  </div>
</section>

<section id="folder" class="view">
  <div class="subtop">
    <button class="back" onclick="goHome()">‹&nbsp; Folders</button>
    <button class="circle" onclick="folderMenu()">•••</button>
  </div>
  <div class="page-heading">
    <h2 id="folderTitle"></h2><p id="folderSub"></p>
  </div>
  <div class="section-title">
    <span>Exercises</span><button class="link-btn" onclick="openExerciseSheet()">New exercise</button>
  </div>
  <div id="exerciseRows" class="rows"></div>
</section>

<section id="exercise" class="view">
  <div class="subtop">
    <button class="back" onclick="backToFolder()">‹&nbsp; Back</button>
    <button class="circle" onclick="exerciseMenu()">•••</button>
  </div>
  <div class="exercise-head">
    <div class="small" id="exerciseFolder"></div>
    <h2 id="exerciseTitle"></h2>
  </div>
  <div id="peopleStrip" class="people-strip"></div>
  <div id="logs"></div>
  <div style="height:25px"></div>
</section>

<section id="people" class="view">
  <div class="subtop"><button class="back" onclick="goHome()">‹&nbsp; Back</button></div>
  <div class="page-heading"><h2>People</h2><p>People appear automatically in every exercise.</p></div>
  <div class="section-title"><span>Your people</span><button class="link-btn" onclick="openPersonSheet()">Add</button></div>
  <div id="peopleRows" class="rows"></div>
</section>

<section id="allExercises" class="view">
  <div class="subtop"><button class="back" onclick="goHome()">‹&nbsp; Back</button></div>
  <div class="page-heading"><h2>Exercises</h2><p>Every exercise in your notebook.</p></div>
  <div id="allRows" class="rows"></div>
</section>

<section id="settings" class="view">
  <div class="subtop"><button class="back" onclick="goHome()">‹&nbsp; Home</button></div>
  <div class="page-heading"><h2>Settings</h2><p>Works offline. Syncs when online.</p></div>
  <div id="syncBox" style="border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:16px;margin-bottom:18px">
    <div style="font-weight:750;font-size:16px">Cloud sync</div>
    <div id="syncStatus" style="font-size:13px;color:#999;margin:4px 0 12px">Not signed in</div>
    <div id="authForm">
      <input id="authEmail" type="email" autocomplete="email" placeholder="Email" style="width:100%;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:8px;background:#fff">
      <input id="authPass" type="password" autocomplete="current-password" placeholder="Password (min 6)" style="width:100%;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:10px;background:#fff">
      <div style="display:flex;gap:8px">
        <button onclick="authSignIn()" style="flex:1;height:46px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700">Sign in</button>
        <button onclick="authSignUp()" style="flex:1;height:46px;border-radius:14px;background:var(--soft);font-weight:700">Create account</button>
      </div>
    </div>
    <div id="authOut" style="display:none;gap:8px">
      <button onclick="syncNow(true)" style="flex:1;height:46px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700">Sync now</button>
      <button onclick="authSignOut()" style="flex:1;height:46px;border-radius:14px;background:var(--soft);font-weight:700">Sign out</button>
    </div>
  </div>
  <div class="rows">
    <button class="row" onclick="exportData()">
      <div><div class="row-title">Export data</div><div class="row-meta">Save a backup of your notebook</div></div><span>›</span>
    </button>
    <button class="row" onclick="document.getElementById('importFile').click()">
      <div><div class="row-title">Import data</div><div class="row-meta">Restore a notebook backup</div></div><span>›</span>
    </button>
    <button class="row" onclick="resetDemo()">
      <div><div class="row-title">Restore example data</div><div class="row-meta">Replace the current notebook with examples</div></div><span>›</span>
    </button>
    <button class="row" onclick="clearAll()">
      <div><div class="row-title">Clear notebook</div><div class="row-meta">Delete folders, exercises and logs</div></div><span>›</span>
    </button>
  </div>
  <input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0]);this.value=''">
</section>

</div>

<div class="bottom">
  <button class="add" id="globalAdd" onclick="globalAdd()">＋ <span id="addLabel">New folder</span></button>
</div>

<div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheet-card">
    <div class="handle"></div>
    <h3 class="sheet-title" id="sheetTitle">New folder</h3>
    <div id="sheetBody"></div>
    <div class="actions">
      <button class="cancel" onclick="closeSheet()">Cancel</button>
      <button class="save" onclick="saveSheet()">Save</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const KEY='curl-notebook-v4';

const demo={
  folders:[
    {id:'push',name:'Push',color:'#ff9b22'},
    {id:'pull',name:'Pull',color:'#f6a329'},
    {id:'legs',name:'Legs',color:'#ff8e18'}
  ],
  people:[{id:'me',name:'Me'}],
  exercises:[
    {id:'incline',folder:'push',name:'Incline Bench Press'},
    {id:'lat',folder:'pull',name:'Lat Pulldown'},
    {id:'curl',folder:'pull',name:'Bicep Curl'}
  ],
  logs:{
    incline:{me:[{date:'Today',time:'08:20',sets:[['1','60','8',''],['2','60','8',''],['3','57.5','9','']]}]},
    lat:{me:[{date:'Yesterday',time:'08:10',sets:[['1','65','9',''],['2','60','10','']]}]},
    curl:{me:[{date:'28 Sep',time:'08:35',sets:[['1','10','10',''],['2','10','9','']]}]}
  }
};

let data=load();
let currentFolder=null,currentExercise=null,currentPerson=null,currentSourceView='home';
let sheetMode=null;

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x&&x.folders&&x.people&&x.exercises)return x;
  }catch(e){}
  return JSON.parse(JSON.stringify(demo));
}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));if(window.markDirty)markDirty()}
function id(){return Math.random().toString(36).slice(2,10)}
function initials(n){return (n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
  document.getElementById('globalAdd').style.display=(id==='settings'||id==='people'||id==='allExercises')?'none':'block';
  const labels={home:'New folder',folder:'New exercise',exercise:'Log session'};
  const label=document.getElementById('addLabel'); if(label) label.textContent=labels[id]||'Add';
}
function goHome(){show('home');renderHome()}
function openPeople(){show('people');renderPeople()}
function openSettings(){show('settings')}
function renderHome(){
  const q=(document.getElementById('search')?.value||'').toLowerCase().trim();
  const folders=data.folders.filter(f=>!q||f.name.toLowerCase().includes(q)||data.exercises.some(e=>e.folder===f.id&&e.name.toLowerCase().includes(q)));
  const grid=document.getElementById('folderGrid');
  grid.innerHTML=folders.length?folders.map(f=>{
    const count=data.exercises.filter(e=>e.folder===f.id).length;
    return `<button class="folder-card" onclick="openFolder('${f.id}')">
      <div class="folder-art">
        <div class="folder-inner"><span class="folder-count">${count} ${count===1?'exercise':'exercises'}</span><span class="folder-dots">•••</span></div>
      </div>
      <div class="folder-name">${esc(f.name)}</div>
      <div class="folder-meta">${count?count+' exercise'+(count===1?'':'s'):'Empty folder'}</div>
    </button>`
  }).join(''):`<div class="empty" style="grid-column:1/-1">No folders yet.</div>`;

  const recent=data.exercises.filter(e=>!q||e.name.toLowerCase().includes(q)||folderName(e.folder).toLowerCase().includes(q)).slice(-6).reverse();
  document.getElementById('recentList').innerHTML=recent.length?recent.map(exerciseRowHTML).join(''):`<div class="empty">No exercises yet.</div>`;
}
function darken(hex){
  const n=parseInt(hex.replace('#',''),16);
  const r=Math.max(0,((n>>16)&255)-12),g=Math.max(0,((n>>8)&255)-12),b=Math.max(0,(n&255)-12);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function saveSheet(){
  const input=document.getElementById('sheetInput');const name=input?.value.trim();
  if(sheetMode!=='log' && !name){input?.focus();return}
  if(sheetMode==='folder'){
    data.folders.push({id:id(),name,color:palette(data.folders.length)});
    persist();closeSheet();renderHome();toast('Folder created');
  }else if(sheetMode==='renameFolder'){
    const f=data.folders.find(x=>x.id===currentFolder);
    if(f&&name){f.name=name;persist();closeSheet();openFolder(currentFolder);toast('Folder renamed')}
  }else if(sheetMode==='exercise'){
    const fid=document.getElementById('sheetSelect').value;
    const e={id:id(),folder:fid,name};
    data.exercises.push(e);data.logs[e.id]={};persist();closeSheet();openFolder(fid);toast('Exercise created');
  }else if(sheetMode==='renameExercise'){
    const e=data.exercises.find(x=>x.id===currentExercise);
    if(e&&name){e.name=name;persist();closeSheet();openExercise(currentExercise);toast('Exercise renamed')}
  }else if(sheetMode==='moveExercise'){
    const e=data.exercises.find(x=>x.id===currentExercise);
    const fid=document.getElementById('sheetSelect').value;
    if(e&&fid){e.folder=fid;persist();closeSheet();openExercise(currentExercise);toast('Exercise moved')}
  }else if(sheetMode==='person'){
    data.people.push({id:id(),name});persist();closeSheet();renderPeople();toast('Person added');
  }else if(sheetMode==='log' || sheetMode==='editSession'){
    const pid=document.getElementById('sheetPerson').value;
    const rows=[...document.querySelectorAll('#setEditor .set-editor-row')];
    const sets=rows.map((row,i)=>{
      const weight=row.querySelector('.set-weight').value.trim();
      const reps=row.querySelector('.set-reps').value.trim();
      return [String(i+1),weight,reps,''];
    }).filter(x=>x[1] && x[2]);
    if(!sets.length){document.querySelector('#setEditor .set-weight')?.focus();return}
    data.logs[currentExercise]??={};
    data.logs[currentExercise][pid]??=[];
    if(sheetMode==='editSession'){
      const old=data.logs[currentExercise][currentPerson].splice(window._editingSessionIndex,1)[0];
      old.sets=sets;
      data.logs[currentExercise][pid].unshift(old);
    }else{
      const now=new Date();
      const date=now.toISOString().slice(0,10);
      const time=now.toTimeString().slice(0,5);

      // A new log on the same calendar day continues today's session.
      // Do not create a second session card for the same exercise/person/date.
      const existing=data.logs[currentExercise][pid].find(session=>session.date===date);
      if(existing){
        const offset=existing.sets.length;
        sets.forEach((set,i)=>set[0]=String(offset+i+1));
        existing.sets.push(...sets);
        existing.time=time;
      }else{
        data.logs[currentExercise][pid].unshift({date,time,sets});
      }
    }
    currentPerson=pid;
    persist();closeSheet();renderPeopleStrip();renderLogs();toast(sheetMode==='editSession'?'Session updated':'Session saved');
  }
}

function exportData(){
  const backup={
    app:'Curl',
    version:1,
    exportedAt:new Date().toISOString(),
    data:JSON.parse(JSON.stringify(data))
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url;
  a.download=`curl-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);

}

function validBackupData(x){
  if(!x || typeof x!=='object') return false;
  if(!Array.isArray(x.folders) || !Array.isArray(x.people) || !Array.isArray(x.exercises) || !x.logs || typeof x.logs!=='object') return false;

  const folderIds=new Set(x.folders.map(f=>f?.id).filter(Boolean));
  const personIds=new Set(x.people.map(p=>p?.id).filter(Boolean));
  const exerciseIds=new Set(x.exercises.map(e=>e?.id).filter(Boolean));

  if(x.folders.some(f=>!f || typeof f.id!=='string' || typeof f.name!=='string')) return false;
  if(x.people.some(p=>!p || typeof p.id!=='string' || typeof p.name!=='string')) return false;
  if(x.exercises.some(e=>!e || typeof e.id!=='string' || typeof e.name!=='string' || !folderIds.has(e.folder))) return false;

  for(const eid of exerciseIds){
    const peopleLogs=x.logs[eid];
    if(peopleLogs===undefined) continue;
    if(!peopleLogs || typeof peopleLogs!=='object' || Array.isArray(peopleLogs)) return false;

    for(const pid of Object.keys(peopleLogs)){
      if(!personIds.has(pid) || !Array.isArray(peopleLogs[pid])) return false;
      for(const session of peopleLogs[pid]){
        if(!session || typeof session.date!=='string' || !Array.isArray(session.sets)) return false;
        if(session.sets.some(s=>!Array.isArray(s) || s.length<3)) return false;
      }
    }
  }
  return true;
}

async function importData(file){
  if(!file) return;
  try{
    const text=await file.text();
    const parsed=JSON.parse(text);
    const incoming=parsed?.data && typeof parsed.data==='object' ? parsed.data : parsed;

    if(!validBackupData(incoming)){
      toast('Invalid Curl backup');
      return;
    }

    const clean={
      folders:incoming.folders,
      people:incoming.people,
      exercises:incoming.exercises,
      logs:incoming.logs
    };

    const replace=confirm('Import this backup and replace the current notebook?');
    if(!replace)return;

    data=clean;
    persist();
    currentFolder=null;
    currentExercise=null;
    currentPerson=data.people[0]?.id||null;
    goHome();
    toast('Backup imported');
  }catch(e){
    toast('Could not import backup');
  }
}

/* ================= CLOUD SYNC (Supabase) + PWA ================= */
const SUPABASE_URL='PASTE_YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY='PASTE_YOUR_SUPABASE_ANON_KEY';
const META_KEY='curl-sync-meta';
let sb=null,session=null,syncing=false,syncTimer=null;
const meta=(()=>{try{return JSON.parse(localStorage.getItem(META_KEY))||{}}catch(e){return{}}})();
function saveMeta(){localStorage.setItem(META_KEY,JSON.stringify(meta))}
function setStatus(t){const s=document.getElementById('syncStatus');if(s)s.textContent=t}
function updateAuthUI(){
  const f=document.getElementById('authForm'),o=document.getElementById('authOut');
  if(!f)return;f.style.display=session?'none':'block';o.style.display=session?'flex':'none';
}
function markDirty(){
  meta.updatedAt=new Date().toISOString();meta.dirty=true;saveMeta();
  setStatus(session?(navigator.onLine?'Syncing…':'Offline — will sync when online'):'Not signed in');
  clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1500);
}
function applyRemote(row){
  data=row.data;localStorage.setItem(KEY,JSON.stringify(data));
  meta.updatedAt=row.updated_at;meta.dirty=false;saveMeta();
  currentFolder=null;currentExercise=null;currentPerson=data.people[0]?.id||null;
  goHome();
}
async function pushLocal(){
  const updated_at=meta.updatedAt||new Date().toISOString();
  const {error}=await sb.from('notebook').upsert({user_id:session.user.id,data,updated_at});
  if(error)throw error;
  meta.updatedAt=updated_at;meta.dirty=false;saveMeta();
}
async function syncNow(manual){
  if(!sb||!session){if(manual)toast('Sign in first');return}
  if(!navigator.onLine){setStatus('Offline — will sync when online');return}
  if(syncing)return;syncing=true;
  try{
    setStatus('Syncing…');
    const {data:row,error}=await sb.from('notebook').select('data,updated_at').maybeSingle();
    if(error)throw error;
    if(!row){await pushLocal()}
    else{
      const remoteT=new Date(row.updated_at).getTime(),localT=meta.updatedAt?new Date(meta.updatedAt).getTime():0;
      if(remoteT>localT){
        if(meta.dirty&&!confirm('Both this device and the cloud have new changes.\n\nOK = keep THIS device\'s version\nCancel = use the cloud version')){applyRemote(row)}
        else if(meta.dirty){meta.updatedAt=new Date().toISOString();await pushLocal()}
        else applyRemote(row);
      }else if(meta.dirty||localT>remoteT){await pushLocal()}
    }
    setStatus('Synced · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
    if(manual)toast('Synced');
  }catch(e){console.error(e);setStatus('Sync failed — will retry');if(manual)toast('Sync failed')}
  finally{syncing=false}
}
async function authSignIn(){
  const email=authEmail.value.trim(),password=authPass.value;
  if(!sb)return toast('Go online once to load sync');
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error)return toast(error.message.slice(0,40));
  toast('Signed in');
}
async function authSignUp(){
  const email=authEmail.value.trim(),password=authPass.value;
  if(!sb)return toast('Go online once to load sync');
  const {data:d,error}=await sb.auth.signUp({email,password});
  if(error)return toast(error.message.slice(0,40));
  toast(d.session?'Account created':'Check your email to confirm');
}
async function authSignOut(){await sb.auth.signOut();toast('Signed out')}
function initSync(){
  updateAuthUI();
  if(!window.supabase||SUPABASE_URL.startsWith('PASTE')){setStatus(SUPABASE_URL.startsWith('PASTE')?'Add Supabase keys in the code':'Sync library not loaded (offline first run)');return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((ev,s)=>{
    session=s;updateAuthUI();
    if(s)syncNow();else setStatus('Not signed in');
  });
  sb.auth.getSession().then(({data:d})=>{session=d.session;updateAuthUI();if(session)syncNow()});
}
window.addEventListener('online',()=>syncNow());
window.addEventListener('offline',()=>session&&setStatus('Offline — changes saved on device'));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
setInterval(()=>syncNow(),60000);
window.addEventListener('load',initSync);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
renderHome();
</script>
</body>
